<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thesis Defense Presentation | Davao Ordinance Conflict Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020914;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    /* Presentation Stage (16:9 Aspect Ratio) */
    #stage-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      background: url('thesis slides assets/background.png') no-repeat center center;
      background-size: cover;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5% 5.5%;
    }

    /* Top Header Bar */
    .slide-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 6%;
      z-index: 10;
    }
    .chapter-tag {
      font-size: 1.15rem;
      font-weight: 600;
      color: #d89b14;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .top-accent-petal {
      width: 28px;
      height: 28px;
      opacity: 0.9;
    }

    /* Slide Title */
    .slide-title {
      font-family: 'PT Serif', Georgia, serif;
      font-size: 2.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1%;
      margin-bottom: 2%;
      line-height: 1.25;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Main Content Area */
    .slide-content {
      flex: 1;
      display: flex;
      align-items: center;
      width: 100%;
      overflow: hidden;
      z-index: 5;
    }

    /* Bullets Layout */
    .bullets-container {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      width: 100%;
      padding-left: 0.5rem;
    }
    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      font-size: 1.45rem;
      line-height: 1.4;
      color: #f8fafc;
      font-weight: 400;
      animation: fadeIn 0.3s ease-in-out;
    }
    .bullet-dot {
      color: #f2b705;
      font-size: 1.6rem;
      line-height: 1;
      margin-top: 0.1rem;
    }

    /* SOP & Objectives Layout */
    .sop-item {
      font-size: 1.18rem;
      line-height: 1.45;
      color: #f1f5f9;
      gap: 0.9rem;
    }

    /* Figure Split Layout */
    .split-layout {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 2.5rem;
      width: 100%;
      height: 100%;
      align-items: center;
    }
    .figure-frame {
      background: #ffffff;
      border: 2px solid #f2b705;
      border-radius: 8px;
      padding: 0.5rem;
      height: 92%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .figure-frame.dark-fig {
      background: #081d3d;
      border-color: #38bdf8;
    }
    .figure-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    .split-bullets {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .split-bullets .bullet-item {
      font-size: 1.25rem;
      line-height: 1.38;
    }

    /* Booktabs Table Layout */
    .table-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .booktabs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      background: rgba(4, 21, 48, 0.7);
      border-top: 3px solid #f2b705;
      border-bottom: 3px solid #f2b705;
      backdrop-filter: blur(8px);
    }
    .booktabs-table th {
      background: #0a1e38;
      color: #f2b705;
      padding: 10px 14px;
      font-weight: 600;
      text-align: right;
      border-bottom: 1.5px solid #d89b14;
      font-size: 0.95rem;
    }
    .booktabs-table th:first-child,
    .booktabs-table th:nth-child(2) {
      text-align: left;
    }
    .booktabs-table td {
      padding: 8px 14px;
      text-align: right;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .booktabs-table td:first-child,
    .booktabs-table td:nth-child(2) {
      text-align: left;
    }
    .booktabs-table tr:hover td {
      background: rgba(242, 183, 5, 0.08);
    }
    .highlight-val {
      color: #f2b705;
      font-weight: 700;
    }

    /* Title Slide Layout */
    .title-slide-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .title-cluster {
      font-size: 1.15rem;
      font-weight: 600;
      color: #d89b14;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .title-divider {
      width: 65%;
      height: 2px;
      background: #ffffff;
      opacity: 0.8;
      margin-bottom: 1.8rem;
    }
    .main-hero-title {
      font-family: 'PT Serif', Georgia, serif;
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 1rem;
      max-width: 90%;
      text-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .main-hero-subtitle {
      font-family: 'PT Serif', Georgia, serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #f2b705;
      margin-bottom: 2.2rem;
    }
    .meta-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      text-align: left;
      background: rgba(6, 21, 44, 0.65);
      border: 1px solid rgba(242, 183, 5, 0.3);
      border-radius: 8px;
      padding: 1.2rem 2.2rem;
      backdrop-filter: blur(10px);
    }
    .meta-col h4 {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }
    .meta-col p {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f8fafc;
    }
    .title-gavel {
      position: absolute;
      right: 2%;
      bottom: 2%;
      width: 170px;
      opacity: 0.95;
      transform: rotate(-10deg);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.7));
    }

    /* Bottom Footer Bar */
    .slide-bottom-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 5%;
      z-index: 10;
    }
    .paper-ref-tag {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 400;
    }
    .slide-number-tag {
      font-family: 'PT Serif', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #f2b705;
    }

    /* Controls Overlay */
    #controls {
      position: fixed;
      bottom: 15px;
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid #334155;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }
    .ctrl-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: #f2b705;
      color: #041530;
      border-color: #f2b705;
    }
    .slide-counter {
      color: #94a3b8;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <!-- Top Bar -->
    <div class="slide-top-header" id="top-header">
      <span class="chapter-tag" id="chapter-label">Chapter 1: Background of the Study</span>
      <img src="thesis slides assets/four petal yellow.png" class="top-accent-petal" alt="Accent">
    </div>

    <!-- Title -->
    <h1 class="slide-title" id="slide-title">Background: Legislative Inflation & Archival Noise</h1>

    <!-- Dynamic Content Area -->
    <div class="slide-content" id="slide-content">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Bottom Bar -->
    <div class="slide-bottom-footer" id="bottom-footer">
      <span class="paper-ref-tag" id="paper-ref-label">Manuscript §1.1 | Fuller (1964), Ruhl & Katz (2015)</span>
      <span class="slide-number-tag" id="slide-number-label">2</span>
    </div>
  </div>

  <!-- Bottom Floating Control Bar -->
  <div id="controls">
    <button class="ctrl-btn" id="prev-btn" onclick="prevSlide()">◀ Previous</button>
    <span class="slide-counter" id="counter-label">Slide 2 / 21</span>
    <button class="ctrl-btn" id="next-btn" onclick="nextSlide()">Next ▶</button>
    <button class="ctrl-btn" id="fs-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  </div>

  <script>
    let deckData = null;
    let currentSlideIndex = 0;

    async function loadDeck() {
      try {
        const response = await fetch('presentation_deck_data.json');
        deckData = await response.json();
        renderSlide(currentSlideIndex);
      } catch (err) {
        console.error("Failed to load deck data:", err);
      }
    }

    function renderSlide(index) {
      if (!deckData || !deckData.slides[index]) return;
      const slide = deckData.slides[index];
      currentSlideIndex = index;

      // Update counters
      document.getElementById('counter-label').textContent = `Slide ${index + 1} / ${deckData.slides.length}`;
      document.getElementById('slide-number-label').textContent = slide.slide_number;

      const topHeader = document.getElementById('top-header');
      const bottomFooter = document.getElementById('bottom-footer');
      const titleElem = document.getElementById('slide-title');
      const contentElem = document.getElementById('slide-content');
      const chLabel = document.getElementById('chapter-label');
      const refLabel = document.getElementById('paper-ref-label');

      chLabel.textContent = slide.chapter || '';
      refLabel.textContent = slide.paper_ref || '';

      if (slide.type === 'title') {
        topHeader.style.visibility = 'hidden';
        bottomFooter.style.visibility = 'hidden';
        titleElem.style.display = 'none';

        contentElem.innerHTML = `
          <div class="title-slide-container">
            <span class="title-cluster">CS Thesis Writing II | Oral Presentation & Mock Defense</span>
            <div class="title-divider"></div>
            <h1 class="main-hero-title">${slide.title}</h1>
            <h2 class="main-hero-subtitle">${slide.subtitle}</h2>
            <div class="meta-box">
              <div class="meta-col">
                <h4>Proponents</h4>
                <p>Ralph Paolo Dulce & Yahyah Odin</p>
              </div>
              <div class="meta-col">
                <h4>Adviser & Professor</h4>
                <p>Adrian "Ogs" Ablazo, MIT<br><span style="font-size:0.95rem; font-weight:normal; color:#cbd5e1;">Ma'am Grace Tacadao</span></p>
              </div>
            </div>
            <img src="thesis slides assets/hammer.png" class="title-gavel" alt="Gavel">
          </div>
        `;
        return;
      }

      // Restore headers for standard content slides
      topHeader.style.visibility = 'visible';
      bottomFooter.style.visibility = 'visible';
      titleElem.style.display = 'block';
      titleElem.textContent = slide.title;

      if (slide.type === 'bullets' || slide.type === 'closing') {
        let bulletsHtml = slide.talking_points.map(pt => `
          <div class="bullet-item">
            <span class="bullet-dot">•</span>
            <span>${pt}</span>
          </div>
        `).join('');
        contentElem.innerHTML = `<div class="bullets-container">${bulletsHtml}</div>`;
      } 
      else if (slide.type === 'sop' || slide.type === 'objectives') {
        let bulletsHtml = slide.talking_points.map(pt => `
          <div class="bullet-item sop-item">
            <span class="bullet-dot">•</span>
            <span>${pt}</span>
          </div>
        `).join('');
        contentElem.innerHTML = `<div class="bullets-container" style="gap:0.9rem;">${bulletsHtml}</div>`;
      }
      else if (slide.type === 'figure_split') {
        let bulletsHtml = slide.talking_points.map(pt => `
          <div class="bullet-item">
            <span class="bullet-dot">•</span>
            <span>${pt}</span>
          </div>
        `).join('');

        let isDark = slide.figure_path.includes('_dark');
        contentElem.innerHTML = `
          <div class="split-layout">
            <div class="figure-frame ${isDark ? 'dark-fig' : ''}">
              <img src="../${slide.figure_path}" alt="${slide.title}">
            </div>
            <div class="split-bullets">
              ${bulletsHtml}
            </div>
          </div>
        `;
      }
      else if (slide.type === 'table') {
        const tbl = slide.table_data;
        let thHtml = tbl.headers.map(h => `<th>${h}</th>`).join('');
        let trHtml = tbl.rows.map(row => {
          let tds = row.map(cell => {
            let isBold = cell.includes('*') || cell.includes('100.0%') || cell.includes('DeBERTa');
            return `<td class="${isBold ? 'highlight-val' : ''}">${cell}</td>`;
          }).join('');
          return `<tr>${tds}</tr>`;
        }).join('');

        let bulletsHtml = slide.talking_points.map(pt => `
          <div class="bullet-item" style="font-size:1.15rem;">
            <span class="bullet-dot">•</span>
            <span>${pt}</span>
          </div>
        `).join('');

        contentElem.innerHTML = `
          <div class="table-container">
            <table class="booktabs-table">
              <thead><tr>${thHtml}</tr></thead>
              <tbody>${trHtml}</tbody>
            </table>
            <div class="bullets-container" style="gap:0.7rem; margin-top:0.5rem;">
              ${bulletsHtml}
            </div>
          </div>
        `;
      }
    }

    function nextSlide() {
      if (deckData && currentSlideIndex < deckData.slides.length - 1) {
        renderSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (deckData && currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Error attempting fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      } else if (e.key === 'Home') {
        renderSlide(0);
      } else if (e.key === 'End' && deckData) {
        renderSlide(deckData.slides.length - 1);
      }
    });

    loadDeck();
  </script>
</body>
</html>
